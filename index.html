<!DOCTYPE html>
<html lang="es-CO">
<head>
  <!-- Hecho con amor para Aitana por Nikol 💜 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💜 Recordatorio de Inyecciones de Aitana 💜</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root {
      --p1: #1a0033;
      --p2: #2d0057;
      --p3: #6b21a8;
      --p4: #a855f7;
      --p5: #d8b4fe;
      --p6: #f3e8ff;
      --bg: #f3e8ff;
      --accent: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--p2);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      text-align: center;
      margin: 1rem auto;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      color: var(--p4);
      animation: fadeSlide 1s ease forwards;
      padding: 0 10px;
      max-width: 90%;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: none; }
    }

    /* ---- calendar ---- */
    .calendar {
      width: 95%;
      max-width: 600px;
      margin: 0 auto 2rem auto;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 1rem;
      box-shadow: 0 4px 15px rgba(107, 33, 168, 0.1);
      backdrop-filter: blur(5px);
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .nav {
      background: var(--p5);
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--p1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s;
    }
    .nav:hover { background: var(--p4); color: white; }
    .nav:disabled { opacity: 0.3; cursor: not-allowed; }

    .month-select {
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--p2);
      padding: 5px 10px;
      border-radius: 8px;
      border: 2px solid var(--p4);
      background: white;
      cursor: pointer;
      outline: none;
      text-transform: capitalize;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 700;
      color: var(--p3);
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cell {
      position: relative;
      background: linear-gradient(135deg, var(--p5), var(--p6));
      border-radius: 0.5rem;
      padding: 0.3rem;
      min-height: 65px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cell:hover { transform: scale(1.05); }
    
    .cell.today {
      box-shadow: 0 0 10px 2px var(--p4);
      border: 2px solid var(--p3);
    }

    .cell.disabled { opacity: 0; pointer-events: none; }
    
    .date-num {
      font-weight: 700;
      color: var(--p1);
      font-size: 0.9rem;
      margin-bottom: auto;
    }

    .dose-indicator {
      display: flex;
      gap: 3px;
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .dose-indicator span {
      opacity: 0.2;
      filter: grayscale(100%);
      transition: all 0.3s;
    }

    /* Estado marcado en el calendario */
    .am-done .dose-indicator .am-icon { opacity: 1; filter: none; }
    .pm-done .dose-indicator .pm-icon { opacity: 1; filter: none; }

    /* ---- modal ---- */
    .modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
      z-index: 100;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    
    .modal-content {
      background: #fff;
      border-radius: 1rem;
      width: 90%;
      max-width: 400px;
      padding: 1.5rem;
      position: relative;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .close {
      position: absolute; top: 0.5rem; right: 0.5rem;
      background: var(--p6); border: none; font-size: 1.5rem;
      width: 35px; height: 35px; border-radius: 50%;
      cursor: pointer; color: var(--p2);
      display: flex; justify-content: center; align-items: center;
    }

    #modalDate { font-size: 1.2rem; color: var(--p1); text-transform: capitalize; }

    .phrase {
      background: var(--p5);
      border-radius: 0.5rem;
      padding: 0.8rem;
      margin: 1rem 0;
      font-weight: 600;
      color: var(--p1);
      animation: bob 4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .card {
      border: 2px solid var(--p3);
      border-radius: 0.8rem;
      padding: 1rem;
      margin: 0.8rem 0;
      display: flex; align-items: center; justify-content: center; gap: 0.8rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s, color 0.3s, transform 0.1s;
    }
    .card:active { transform: scale(0.95); }
    .card.checked { background: var(--p3); color: #fff; }
    .card .icon { font-size: 1.5rem; }

    .heart-burst {
      position: absolute;
      width: 20px; height: 20px;
      pointer-events: none;
      animation: fly 0.8s forwards ease-out;
      z-index: 1000;
    }
    @keyframes fly {
      from { opacity: 1; transform: scale(1) translate(0,0); }
      to { opacity: 0; transform: scale(0.5) translate(var(--dx), var(--dy)); }
    }

    /* ---- background hearts & sparkles ---- */
    .spark {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; overflow: hidden; z-index: -2;
    }
    .spark div {
      position: absolute; width: 6px; height: 6px;
      background: radial-gradient(circle, var(--p4), transparent);
      border-radius: 50%;
      animation: float 6s linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(0); opacity: 0; }
    }

    /* ---- animals (Sent to background to avoid overlap) ---- */
    .animal {
      position: fixed;
      width: 15vw;
      min-width: 60px;
      max-width: 90px;
      opacity: 0.25; /* Suave para que no estorbe la lectura */
      z-index: -1;
      pointer-events: none;
      animation: floaty 4s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    #bunny { bottom: 5%; left: 5%; }
    #bear { bottom: 5%; right: 5%; }
    #cat { top: 10%; left: 50%; transform: translateX(-50%); }
    #elephant { top: 30%; left: 5%; }

    @media (max-width: 480px) {
      .cell { min-height: 55px; }
      .date-num { font-size: 0.8rem; }
      .dose-indicator { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- Animals Background -->
  <svg id="bunny" class="animal" viewBox="0 0 64 64" fill="var(--p4)">
    <circle cx="32" cy="32" r="30"/>
    <ellipse cx="32" cy="32" rx="20" ry="25" fill="var(--p5)"/>
    <circle cx="24" cy="28" r="2"/>
    <circle cx="40" cy="28" r="2"/>
    <path d="M28,44 q4,6 8,0" stroke="var(--p2)" stroke-width="2" fill="none"/>
    <path d="M20,12 q12,-8 24,0" stroke="var(--p2)" stroke-width="2" fill="none"/>
  </svg>
  <svg id="bear" class="animal" viewBox="0 0 64 64" fill="var(--p3)">
    <circle cx="32" cy="32" r="30"/>
    <ellipse cx="32" cy="32" rx="22" ry="28" fill="var(--p4)"/>
    <circle cx="24" cy="28" r="2"/>
    <circle cx="40" cy="28" r="2"/>
  </svg>
  <svg id="cat" class="animal" viewBox="0 0 64 64" fill="var(--p5)">
    <polygon points="32,5 45,30 19,30"/>
    <circle cx="32" cy="38" r="20"/>
    <circle cx="24" cy="30" r="2"/>
    <circle cx="40" cy="30" r="2"/>
    <path d="M28,45 q4,6 8,0" stroke="var(--p2)" stroke-width="2" fill="none"/>
    <path d="M20,12 q12,-8 24,0" stroke="var(--p2)" stroke-width="2" fill="none"/>
  </svg>
  <svg id="elephant" class="animal" viewBox="0 0 64 64" fill="var(--p2)">
    <circle cx="32" cy="32" r="30"/>
    <ellipse cx="32" cy="32" rx="18" ry="24" fill="var(--p4)"/>
    <circle cx="24" cy="28" r="2"/>
    <circle cx="40" cy="28" r="2"/>
    <path d="M30,45 q4,6 8,0" stroke="var(--p1)" stroke-width="2" fill="none"/>
  </svg>

  <!-- Sparkles -->
  <div class="spark" id="sparkles"></div>

  <h1>💜 Recordatorio de Inyecciones de Aitana 💜</h1>

  <div class="calendar">
    <div class="cal-header">
      <button class="nav" id="prev">&lt;</button>
      <select id="monthSelect" class="month-select"></select>
      <button class="nav" id="next">&gt;</button>
    </div>
    
    <div class="weekdays">
      <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close" id="closeModal">&times;</button>
      <h2 id="modalDate"></h2>
      <div class="phrase" id="modalPhrase"></div>
      <div class="card" data-dose="am" id="cardAM">
        <span class="icon">☀️</span>
        <span>💉 Inyección 10:00 AM</span>
      </div>
      <div class="card" data-dose="pm" id="cardPM">
        <span class="icon">🌙</span>
        <span>💉 Inyección 10:00 PM</span>
      </div>
    </div>
  </div>

  <script>
    /* --------- data --------- */
    const start = new Date(2026, 4, 1); // 1 de Mayo 2026 (meses en JS empiezan en 0)
    const end   = new Date(2027, 0, 1); // 1 de Enero 2027
    const phrases = [
      "Te amodoro 💜","Te adoroamo 🐾","Abrazame para siempre 🫂","Te amo musho 💜",
      "Te quiero mucho 🌸","Te kiero 🐰","Dame besitos (Nikol) 💋","Te kiero morder 🐾",
      "Kiero pasar mi vida contigo 💜","Durmamos abrazaditos 🌙","Tengo más de 100mil razones para quedarme contigo ✨",
      "Kédate para siempre 💜","Me encantan tus ojos 👀","Me encanta tu pelo 🌸","Me encanta tu nariz 🐰",
      "Me encantan tus piernas 💜","Me encanta tu boca 💋","Me encantan tus cejas ✨","Me encantas 💜","Te extrañio 🌙"
    ];

    const storageKey = 'aitana_injections';
    let data = {};

    // --------- helpers ---------
    function loadData() {
      const raw = localStorage.getItem(storageKey);
      if (raw) data = JSON.parse(raw);
    }
    function saveData() {
      localStorage.setItem(storageKey, JSON.stringify(data));
    }
    function fmt(date) { 
      const d = new Date(date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0]; 
    }
    function getDayInfo(dateStr) {
      return data[dateStr] || { am: false, pm: false };
    }
    function setDayInfo(dateStr, dose, val) {
      if(!data[dateStr]) data[dateStr] = { am: false, pm: false };
      data[dateStr][dose] = val;
      saveData();
    }
    function dayOfYear(date) {
      const startOfYear = new Date(date.getFullYear(), 0, 0);
      return Math.floor((date - startOfYear) / 86400000);
    }
    function phrasesFor(date) {
      const idx = dayOfYear(date) % phrases.length;
      return [phrases[idx], phrases[(idx+3) % phrases.length]];
    }

    // --------- calendar setup ---------
    const grid = document.getElementById('grid');
    const monthSelect = document.getElementById('monthSelect');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let viewDate = new Date(start);

    // Populate month select dropdown
    function populateMonths() {
      let tempDate = new Date(start.getFullYear(), start.getMonth(), 1);
      while (tempDate <= end) {
        let option = document.createElement('option');
        option.value = `${tempDate.getFullYear()}-${tempDate.getMonth()}`;
        let label = tempDate.toLocaleDateString('es-CO', {month:'long', year:'numeric'});
        option.textContent = label;
        monthSelect.appendChild(option);
        tempDate.setMonth(tempDate.getMonth() + 1);
      }
    }

    function renderCalendar() {
      grid.innerHTML = '';
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      
      // Update Select Value
      monthSelect.value = `${year}-${month}`;

      const first = new Date(year, month, 1);
      const startDay = (first.getDay() + 6) % 7; // Monday = 0
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // empty cells for offset
      for(let i=0; i<startDay; i++){
        const empty = document.createElement('div');
        empty.className = 'cell disabled';
        grid.appendChild(empty);
      }

      for(let d=1; d<=daysInMonth; d++){
        const date = new Date(year, month, d);
        const iso = fmt(date);
        const info = getDayInfo(iso);
        
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        // Highlight today
        const today = new Date();
        if(date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth() && date.getDate() === today.getDate()){
          cell.classList.add('today');
        }

        if(info.am) cell.classList.add('am-done');
        if(info.pm) cell.classList.add('pm-done');

        cell.innerHTML = `
          <div class="date-num">${d}</div>
          <div class="dose-indicator">
            <span class="am-icon">☀️</span>
            <span class="pm-icon">🌙</span>
          </div>`;
          
        cell.dataset.iso = iso;
        cell.addEventListener('click', () => openModal(date));
        grid.appendChild(cell);
      }

      // Check boundaries to disable prev/next buttons
      const checkPrev = new Date(year, month - 1, 1);
      const checkNext = new Date(year, month + 1, 1);
      prevBtn.disabled = checkPrev < new Date(start.getFullYear(), start.getMonth(), 1);
      nextBtn.disabled = checkNext > end;
    }

    // Listeners for Navigation
    prevBtn.onclick = () => { viewDate.setMonth(viewDate.getMonth() - 1); renderCalendar(); };
    nextBtn.onclick = () => { viewDate.setMonth(viewDate.getMonth() + 1); renderCalendar(); };
    monthSelect.addEventListener('change', (e) => {
      const [y, m] = e.target.value.split('-');
      viewDate = new Date(y, m, 1);
      renderCalendar();
    });

    // --------- modal ---------
    const modal = document.getElementById('modal');
    const modalDate = document.getElementById('modalDate');
    const modalPhrase = document.getElementById('modalPhrase');
    const closeModal = document.getElementById('closeModal');
    let activeDate = null;

    function openModal(date) {
      activeDate = date;
      const iso = fmt(date);
      const info = getDayInfo(iso);
      
      modalDate.textContent = date.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long'});
      const [p1, p2] = phrasesFor(date);
      modalPhrase.textContent = `${p1} ${p2}`;
      
      document.querySelectorAll('.card').forEach(card => {
        const dose = card.dataset.dose;
        const checked = info[dose];
        card.classList.toggle('checked', checked);
      });
      
      modal.classList.add('show');
    }

    closeModal.onclick = () => modal.classList.remove('show');
    modal.addEventListener('click', e => { if(e.target === modal) modal.classList.remove('show'); });

    // checkbox cards inside modal
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const dose = card.dataset.dose;
        const iso = fmt(activeDate);
        const prev = getDayInfo(iso)[dose];
        
        setDayInfo(iso, dose, !prev);
        card.classList.toggle('checked', !prev);
        
        renderCalendar(); // update background grid immediately
        
        if(!prev) { // If turning ON
          heartBurst(card);
          // Floating love text
          const love = document.createElement('div');
          love.textContent = 'Te amo 💜';
          love.style.position = 'fixed';
          love.style.top = '50%'; left = '50%';
          love.style.transform = 'translate(-50%,-50%)';
          love.style.fontSize = '2.5rem';
          love.style.fontFamily = "'Pacifico', cursive";
          love.style.color = 'var(--p4)';
          love.style.zIndex = 2000;
          love.style.textShadow = "0px 0px 10px white";
          love.style.opacity = 1;
          love.style.transition = 'opacity 1s, transform 1s';
          document.body.append(love);
          
          setTimeout(() => {
            love.style.opacity = 0;
            love.style.transform = 'translate(-50%, -100px)';
          }, 50);
          setTimeout(() => love.remove(), 1050);
        }
      });
    });

    // heart burst animation
    function heartBurst(origin) {
      const rect = origin.getBoundingClientRect();
      const colors = ['#ff69b4', '#ff1493', '#db70ff', '#a855f7'];
      for(let i=0; i<8; i++){
        const el = document.createElement('div');
        el.className = 'heart-burst';
        el.textContent = '💜';
        el.style.left = (rect.left + rect.width/2 - 10) + 'px';
        el.style.top  = (rect.top + rect.height/2 - 10) + 'px';
        const angle = (i/8) * 2 * Math.PI;
        const distance = 50;
        el.style.setProperty('--dx', `${Math.cos(angle)*distance}px`);
        el.style.setProperty('--dy', `${Math.sin(angle)*distance}px`);
        document.body.append(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    // --------- background sparkles ----------
    const spark = document.getElementById('sparkles');
    for(let i=0; i<20; i++){
      const dot = document.createElement('div');
      dot.style.left = Math.random() * 100 + '%';
      dot.style.animationDuration = (4 + Math.random() * 4) + 's';
      dot.style.animationDelay = (Math.random() * 5) + 's';
      spark.append(dot);
    }

    // --------- init ----------
    loadData();
    populateMonths();
    renderCalendar();
  </script>
</body>
</html>
